[package]
name = "muxy-daemon"
version = "0.0.0"
edition = "2021"

[[bin]]
name = "muxy-daemon"
path = "src/main.rs"

[dependencies]
muxy-proto = { path = "../muxy-proto" }
muxy-workspace = { path = "../muxy-workspace" }
muxy-vt = { path = "../muxy-vt" }
muxy-config = { path = "../muxy-config" }
tokio = { workspace = true }
portable-pty = { workspace = true }
anyhow = { workspace = true }
notify-rust = "4"
serde_json = "1"
rustix = { version = "0.38", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
