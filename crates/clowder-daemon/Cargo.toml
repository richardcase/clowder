[package]
name = "clowder-daemon"
version.workspace = true
edition.workspace = true

[[bin]]
name = "clowder-daemon"
path = "src/main.rs"

[dependencies]
clowder-proto = { path = "../clowder-proto" }
clowder-workspace = { path = "../clowder-workspace" }
clowder-vt = { path = "../clowder-vt" }
clowder-config = { path = "../clowder-config" }
tokio = { workspace = true }
portable-pty = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
notify-rust = "4"
serde_json = "1"
rustix = { version = "0.38", features = ["fs"] }
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
base64 = "0.22"
getrandom = "0.2"
rustls-pemfile = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }   # paused-clock tests (tokio::time::advance)
