[package]
name = "muxy-client"
version = "0.0.0"
edition = "2021"

[dependencies]
muxy-proto = { path = "../muxy-proto" }
tokio = { workspace = true }
anyhow = { workspace = true }

[target.'cfg(unix)'.dependencies]
# raw-mode terminal control for the interactive binary only
crossterm = "0.28"

[dev-dependencies]
muxy-daemon = { path = "../muxy-daemon" }

[[bin]]
name = "muxy"
path = "src/main.rs"
