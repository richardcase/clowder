name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Dispatchable so release.yml can start the required checks on its bump branch: refs pushed with
  # GITHUB_TOKEN do not start workflow runs, but workflow_dispatch is the documented exception, and
  # the resulting check runs attach to the head SHA — which is what main's ruleset evaluates.
  workflow_dispatch:

# Cancel superseded runs on the same ref. The event is part of the group so a manual dispatch and a
# PR's own run never cancel each other.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether this change needs the macOS build. Pure bash so the rule is unit-testable —
  # see scripts/changed-scope.sh --self-test, which runs in commit-lint below.
  changes:
    name: classify change scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          # merge-base needs real history; the default depth-1 checkout has none.
          fetch-depth: 0

      - id: classify
        env:
          # Same reasoning as commit-lint: on `pull_request` actions/checkout checks out the merge
          # ref, so HEAD is not the branch tip. On a dispatch or push there is no PR context.
          BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          scope="$(scripts/changed-scope.sh "$BASE" "$HEAD_REF" "$BRANCH")"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "change scope: **$scope**" >> "$GITHUB_STEP_SUMMARY"

  # Cheap, parallel gate: a bad commit subject fails in seconds without burning macOS minutes.
  # PR-only — commits reaching `main` have already been through this on their PR.
  commit-lint:
    name: commit messages (conventional commits)
    # Runs for `pull_request` AND `workflow_dispatch` (release.yml's bump branch), but not for a
    # push to main — those commits were already checked on their PR.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # merge-base needs real history; the default depth-1 checkout has none.
          fetch-depth: 0

      # Pass the SHAs explicitly: on `pull_request`, actions/checkout checks out the *merge* ref,
      # so HEAD is not the branch tip. On a dispatch there is no PR context, so fall back to
      # comparing the dispatched ref against main.
      - name: Check commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: scripts/check-commit-messages.sh "$BASE" "$HEAD_REF"

      # Lives here so the semver rules become a required check for free, without adding a new
      # context to main's ruleset. No dependencies, runs in under a second.
      - name: next-version.sh self-tests
        run: scripts/next-version.sh --self-test

      # Same reasoning: the release workflow's check-gating decision is a pure function of JSON, and
      # a bug in it cannot be caught outside a real release. Fixtures make it a required check.
      - name: check-runs-state.sh self-tests
        run: scripts/check-runs-state.sh --self-test

      # Same reasoning again: the scope classifier decides whether the macOS build runs at all, and
      # a wrong answer either burns 10x-rate minutes or lets a change reach main unbuilt. Fixtures
      # make it a required check.
      - name: changed-scope.sh self-tests
        run: scripts/changed-scope.sh --self-test

      # Same reasoning as the self-tests above, and one more: this guard is what stops a private
      # repo link or an internal milestone scope reaching a public page, so a green run has to be
      # evidence it actually ran.
      - name: check-release-notes.sh self-tests
        run: scripts/check-release-notes.sh --self-test

      - name: Release notes
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          # Comma-joined so the script needs no `gh` call and stays unit-testable. Empty outside a
          # pull request, which is correct: the bump commit is `chore:` and requires no note.
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: scripts/check-release-notes.sh "$BASE" "$HEAD_REF"

  build-and-test-macos:
    name: build + test (macOS, unsigned) — full
    needs: changes
    if: needs.changes.outputs.scope == 'product'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Lint the Homebrew cask template (rendered with placeholder values) so a cask syntax/style error
      # is caught on the PR, not at release time when the tap bump runs. Homebrew is preinstalled.
      - name: Lint Homebrew cask template (brew style)
        run: |
          dummy_sha="$(printf '0%.0s' $(seq 1 64))"
          mkdir -p "$RUNNER_TEMP/Casks"
          sed -e "s/@@VERSION@@/0.0.0/" -e "s/@@SHA256@@/$dummy_sha/" \
            scripts/homebrew/clowder.rb.tmpl > "$RUNNER_TEMP/Casks/clowder.rb"
          brew style "$RUNNER_TEMP/Casks/clowder.rb"

      - name: Select Xcode (Metal shader compiler needs full Xcode)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Pin to Xcode 16.x (latest minor on the runner): the recipe was verified on Xcode 16, and
          # this avoids drift to a toolchain where the Metal compiler is a separate download.
          xcode-version: '16'

      - name: Verify toolchain
        run: |
          xcode-select -p
          xcrun metal --version
          swift --version

      - name: Install zig (Homebrew — reliable bottle CDN; the zig download mirrors are flaky in CI)
        run: |
          brew install zig
          zig version

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Cache libghostty (built once per pin/patch)
        id: libghostty-cache
        uses: actions/cache@v4
        with:
          path: |
            macos/vendor/libghostty/ghostty-internal.a
            macos/Sources/GhosttyKit/include/ghostty.h
          key: libghostty-${{ runner.os }}-${{ hashFiles('scripts/build-libghostty.sh', 'scripts/libghostty-darwin-install.patch') }}

      - name: Build libghostty (cache miss only)
        if: steps.libghostty-cache.outputs.cache-hit != 'true'
        run: scripts/build-libghostty.sh

      - name: Rust tests (whole workspace)
        run: cargo test --workspace --locked

      - name: Rust tests — load-sensitive (ignored, serial)
        run: cargo test --workspace --locked -- --ignored --test-threads=1

      - name: Swift tests (ClowderCore)
        run: swift test
        working-directory: macos

      - name: Assemble unsigned Clowder.app
        run: scripts/build-app.sh

      - name: Upload unsigned app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clowder-app-unsigned
          # Upload the `dist` root so the artifact keeps the `Clowder.app/Contents/...` bundle structure
          # (pointing at `dist/Clowder.app` would strip the top `.app` dir, yielding an unusable bundle).
          path: dist
          if-no-files-found: error

  # The site's own checks, ported from clowder-site's ci.yml. Ubuntu-only and cheap, so it runs
  # whenever the site changes. NOT in main's required set: adding a third required context is a
  # ruleset change with release-gating consequences, and this does not need to be one.
  site-ci:
    name: build + check (site)
    # Deliberately unconditional — no `needs: changes`, no `if:`. It is ubuntu and cheap, a product
    # change can touch site/ too, and from Milestone 2 the site reads scripts/lib/product.sh, so a
    # product change really can break the site build. Gating it on scope would serialize it behind
    # `changes` for no benefit and hide exactly the breakage it is here to catch.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      # Before the build, for the reason documented in site/scripts/audit-selftest.sh: audit.sh's
      # dangerous failure mode is a silent pass, so a green build is not evidence the guards ran
      # unless the self-test ran first. Pure bash, so it needs no dependencies.
      - name: Verify the build guards actually detect violations
        run: ./scripts/audit-selftest.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: 'site/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'site/package-lock.json'

      - name: Install
        run: npm ci

      # Type errors do not fail `astro build` — Astro strips types rather than checking them — so
      # without this step nothing would ever catch one.
      - name: Type-check
        run: npm run check

      # `npm run build` chains scripts/audit.sh, so the private-repo and base-path guards run here.
      #
      # GITHUB_TOKEN authenticates the release lookup in src/data/release.ts. Unauthenticated
      # api.github.com is capped at 60 requests/hour per IP and runner IPs are shared, so without it
      # the build intermittently falls back to the pinned version.
      - name: Build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # THE REQUIRED CHECK. It always runs, so the required context always reports exactly one check
  # run, and it reports success only if the real build succeeded or was legitimately not needed.
  #
  # Why a gate rather than two jobs sharing this name: an `if:`-skipped job still produces a check
  # run, with conclusion `skipped`. Two jobs with this name would therefore file TWO check runs
  # under it, and scripts/check-runs-state.sh picks the latest by (started_at, id) and counts
  # `skipped` as FAILED — so the release merge gate would fail on a coin flip.
  required-build-gate:
    name: build + test (macOS, unsigned)
    needs: [changes, build-and-test-macos]
    # Without always(), this job would itself be skipped whenever build-and-test-macos is skipped,
    # which recreates the exact problem it exists to solve.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the macOS build to have passed, or to have been genuinely unnecessary
        env:
          SCOPE: ${{ needs.changes.outputs.scope }}
          BUILD: ${{ needs.build-and-test-macos.result }}
        run: |
          echo "scope=$SCOPE build=$BUILD"

          if [ "$SCOPE" = 'site-only' ] && [ "$BUILD" = 'skipped' ]; then
            echo "site-only change — the macOS build was not required." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$SCOPE" = 'product' ] && [ "$BUILD" = 'success' ]; then
            echo "product change — the macOS build passed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Anything else is a state we did not design for: a cancelled build, a failed one, or a
          # scope/result pair that cannot legitimately occur. Refuse rather than guess — this check
          # is what a release merges on.
          echo "::error::refusing to pass: scope=$SCOPE build=$BUILD"
          exit 1
