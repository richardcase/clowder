name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub Release

jobs:
  release:
    name: build + publish (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Verify the tag matches VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d '[:space:]' < VERSION)"
          echo "tag=$tag VERSION=$file"
          [ "$tag" = "$file" ] || { echo "::error::tag v$tag does not match VERSION $file"; exit 1; }

      - name: Select Xcode (Metal shader compiler needs full Xcode)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16'

      - name: Verify toolchain
        run: |
          xcrun metal --version
          swift --version

      - name: Install zig (Homebrew — reliable bottle CDN; the zig download mirrors are flaky in CI)
        run: |
          brew install zig
          zig version

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache libghostty (built once per pin/patch)
        id: libghostty-cache
        uses: actions/cache@v4
        with:
          path: |
            macos/vendor/libghostty/ghostty-internal.a
            macos/Sources/GhosttyKit/include/ghostty.h
          key: libghostty-${{ runner.os }}-${{ hashFiles('scripts/build-libghostty.sh', 'scripts/libghostty-darwin-install.patch') }}

      - name: Build libghostty (cache miss only)
        if: steps.libghostty-cache.outputs.cache-hit != 'true'
        run: scripts/build-libghostty.sh

      - name: Assemble Clowder.app
        run: scripts/build-app.sh

      # Signing is gated on the presence of the Developer ID cert secret, so forks / an unconfigured
      # repo still publish an unsigned build. Secrets can't be used in a job/step `if:`, so surface a
      # boolean output and gate the signed/unsigned steps on it.
      - name: Detect signing secrets
        id: signing
        env:
          CODESIGN_P12_BASE64: ${{ secrets.CODESIGN_P12_BASE64 }}
        run: |
          if [ -n "$CODESIGN_P12_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No CODESIGN_P12_BASE64 secret — publishing an UNSIGNED build."
          fi

      # ---------- signed path (Developer ID configured) ----------
      - name: Import Developer ID certificate into a temp keychain
        if: steps.signing.outputs.enabled == 'true'
        env:
          CODESIGN_P12_BASE64: ${{ secrets.CODESIGN_P12_BASE64 }}
          CODESIGN_P12_PASSWORD: ${{ secrets.CODESIGN_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/clowder-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CODESIGN_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CODESIGN_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "CODESIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Sign, notarize, and package a DMG
        if: steps.signing.outputs.enabled == 'true'
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          # API-key notarization (default). Leave these empty and set the Apple-ID trio instead to
          # use that path — package-dmg.sh auto-selects whichever set is fully present.
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          scripts/sign-app.sh
          if [ -n "$NOTARY_KEY_BASE64" ]; then
            echo "$NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            export NOTARY_KEY="$RUNNER_TEMP/notary.p8"
          fi
          scripts/package-dmg.sh
          rm -f "$RUNNER_TEMP/notary.p8"

      - name: Publish GitHub Release (signed)
        if: steps.signing.outputs.enabled == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Clowder-*-macos.dmg
          generate_release_notes: true
          body: |
            Signed & notarized macOS build of Clowder (`${{ github.ref_name }}`).

            Open the `.dmg` and drag **Clowder** to **Applications**. No Gatekeeper workaround needed.

      # ---------- unsigned fallback (no secrets: forks / unconfigured) ----------
      - name: Zip the unsigned app bundle
        if: steps.signing.outputs.enabled != 'true'
        run: ditto -c -k --keepParent dist/Clowder.app "dist/Clowder-${GITHUB_REF_NAME}-macos.zip"

      - name: Publish GitHub Release (unsigned)
        if: steps.signing.outputs.enabled != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Clowder-*-macos.zip
          generate_release_notes: true
          body: |
            Unsigned macOS build of Clowder (`${{ github.ref_name }}`).

            > This build is **not code-signed or notarized** (no signing secrets configured). On first
            > launch macOS Gatekeeper will quarantine it — right-click the app → **Open**, or run
            > `xattr -dr com.apple.quarantine Clowder.app`.

      - name: Remove temp signing keychain
        if: always() && steps.signing.outputs.enabled == 'true'
        run: security delete-keychain "$RUNNER_TEMP/clowder-signing.keychain-db" || true
