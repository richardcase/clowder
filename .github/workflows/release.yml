name: Release

# Manually dispatched, NOT tag-triggered. The version is derived from the Conventional Commit types
# since the last release tag (see scripts/next-version.sh and docs/versioning.md); a dispatch that
# finds nothing releasable ends green having done nothing.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compute and report the next version, then stop. Changes nothing.'
        type: boolean
        default: false
      version_override:
        description: 'Explicit version (e.g. 1.0.0) instead of the computed one. The escape hatch for cutting 1.0.0.'
        type: string
        default: ''
      prerelease:
        description: 'Pre-release identifier to append (e.g. rc1). Skips the Homebrew cask bump.'
        type: string
        default: ''

# Never cancel a release in flight: a cancelled `bump` orphans a branch and an open PR, and a
# cancelled `release` can leave a signed-but-unpublished build. Concurrent dispatches queue, then
# trip the guard rails in `plan`.
concurrency:
  group: release
  cancel-in-progress: false

# default_workflow_permissions is `read` on this repo; every job grants only what it needs.
permissions: {}

jobs:
  # ---------------------------------------------------------------- plan (cheap, ubuntu)
  plan:
    name: plan the release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      proceed:    ${{ steps.guards.outputs.proceed }}
      needs_bump: ${{ steps.compute.outputs.needs_bump }}
      version:    ${{ steps.compute.outputs.version }}
      tag:        ${{ steps.compute.outputs.tag }}
      bump:       ${{ steps.compute.outputs.bump }}
      prev_tag:   ${{ steps.compute.outputs.prev_tag }}
      prerelease: ${{ steps.compute.outputs.prerelease }}
      base_sha:   ${{ steps.compute.outputs.base_sha }}
    steps:
      # fetch-depth: 0 is mandatory — `git describe` on a depth-1 checkout finds no tag and would
      # silently take next-version.sh's bootstrap path.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }

      # A release must be cut from main. dry_run is exempt so the plan job can be rehearsed from the
      # branch that introduces it, before it exists on main.
      - name: Refuse to release from a non-default branch
        if: ${{ github.ref_name != 'main' && inputs.dry_run != true }}
        run: |
          echo "::error::releases must be dispatched from main (got '${{ github.ref_name }}'); use dry_run to rehearse from a branch"
          exit 1

      - name: Compute the next version
        id: compute
        env:
          OVERRIDE: ${{ inputs.version_override }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          # Explicit `if` rather than `[ -n … ] && args+=(…)`: under `bash -e` (GitHub's default
          # shell) such a line exits the step when the test is false and it happens to be last.
          args=()
          if [ -n "$OVERRIDE" ]; then args+=(--override "$OVERRIDE"); fi
          if [ -n "$PRERELEASE" ]; then args+=(--prerelease "$PRERELEASE"); fi
          scripts/next-version.sh "${args[@]}" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Guard rails
        id: guards
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ steps.compute.outputs.release }}
          TAG: ${{ steps.compute.outputs.tag }}
          VERSION: ${{ steps.compute.outputs.version }}
          BUMP: ${{ steps.compute.outputs.bump }}
          BUMP_RAW: ${{ steps.compute.outputs.bump_raw }}
          PREV_TAG: ${{ steps.compute.outputs.prev_tag }}
          COMMITS: ${{ steps.compute.outputs.commits }}
          RELEASABLE: ${{ steps.compute.outputs.releasable }}
          NEEDS_BUMP: ${{ steps.compute.outputs.needs_bump }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "## Release plan"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| previous release | \`${PREV_TAG:-<none>}\` |"
            echo "| commits since | $COMMITS ($RELEASABLE releasable) |"
            echo "| bump | \`$BUMP\`$([ "$BUMP" != "$BUMP_RAW" ] && echo " (asked for \`$BUMP_RAW\`, folded by the 0.x rule)")|"
            echo "| next version | \`${VERSION:-nothing to release}\` |"
            echo "| version bump needed | $NEEDS_BUMP |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$RELEASE" != true ]; then
            echo "::notice::No releasable commits since ${PREV_TAG:-the start of history} — nothing to do."
            echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # An existing tag means that version already shipped. Bumping onto it would attach a second
          # release to the same name; recomputing around it would skip a version silently.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            # A tag can exist with NO release: the tag push succeeds and the publish step then fails.
            # `gh release delete --cleanup-tag` errors in that state, so name the raw ref delete too.
            echo "::error::$TAG already exists. Delete it — 'gh release delete $TAG --cleanup-tag', or"
            echo "::error::'gh api -X DELETE repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG' if no release"
            echo "::error::was published — or pass version_override."
            exit 1
          fi

          open_pr="$(gh pr list --state open --label release --json number --jq '.[0].number // empty')"
          if [ -n "$open_pr" ]; then
            echo "::error::release PR #$open_pr is already open — merge or close it before dispatching again."
            exit 1
          fi

          # A leftover branch from a failed run: refuse rather than force-update someone's work.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/release/$TAG" >/dev/null 2>&1; then
            echo "::error::branch release/$TAG already exists — delete it before dispatching again."
            exit 1
          fi

          if [ "$DRY_RUN" = true ]; then
            echo "::notice::dry run — would release $TAG. Nothing committed, tagged, or published."
            echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------- bump (PR to main, ubuntu, mostly idle)
  # main's ruleset requires a PR, signed commits and green checks, with no bypass actors — so the
  # version bump cannot be pushed directly. See docs/versioning.md.
  bump:
    name: bump VERSION via a PR
    needs: plan
    if: needs.plan.outputs.proceed == 'true' && needs.plan.outputs.needs_bump == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      actions: write      # to dispatch ci.yml on the release branch (see below)
      # Required by the check wait: `/commits/{sha}/check-runs` reads check runs. Workflow-level
      # `permissions: {}` makes every unlisted scope `none`, so omitting this 403s at exactly the
      # point where the release is waiting to merge.
      checks: read
    outputs:
      merge_sha: ${{ steps.merge.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: release/${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
      BASE_SHA: ${{ needs.plan.outputs.base_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.base_sha }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable as of 2026-09-01 — no version tag, so Dependabot can't auto-track this one; re-pin periodically to pick up new stable Rust

      - name: Set the version
        run: scripts/set-version.sh "$VERSION"

      # set-version.sh runs `cargo update --workspace`, which only re-resolves the lockfile (never
      # compiles, and Cargo.lock is target-independent, so ubuntu is fine). If it touched anything
      # else, a stale lockfile is being silently repaired inside a release — stop and look.
      #
      # `git status`, not `git diff --name-only`: diff only sees tracked changes, so an untracked
      # file left in the runner workspace, or an index-only change, would slip past silently. That
      # gap matters now that gh-file-changes.sh (the "Commit the bump" step, below) enumerates via
      # `git status --untracked-files=all` — anything invisible to THIS assertion is exactly what
      # that script WOULD still fold into the signed commit unremarked.
      #
      # MUST run before "Collect the release notes": that step deliberately adds a 4th file and some
      # deletions, which would otherwise fail this assertion for the right reason but a confusing
      # message ("unexpected files changed" on a release that is working correctly).
      - name: Assert the bump touched exactly three files
        run: |
          changed="$(git status --porcelain=v1 --untracked-files=all | cut -c4- | sort | tr '\n' ' ')"
          if [ "$changed" != "Cargo.lock Cargo.toml VERSION " ]; then
            echo "::error::unexpected files changed: $changed"
            git status --porcelain=v1 --untracked-files=all
            exit 1
          fi

      # Skipped for a pre-release (release.yml dispatched with `prerelease: rc1` etc, producing a
      # version like 0.7.0-rc1). Collecting here would DELETE every accumulated fragment into
      # v0.7.0-rc1.md; the real final 0.7.0 release that follows would then find nothing left to
      # collect and publish "Maintenance and fixes.", with the actual notes stranded in an rc file
      # that is never published to the tap (see the Homebrew-tap step's own prerelease guard,
      # further down in the `release` job) and that no user can install. Same guard, same reason.
      #
      # Runs BEFORE "Create the release branch" on purpose: collection needs no branch to exist, and
      # if the content guard inside it rejects the collected notes, failing here leaves nothing to
      # clean up. Failing after branch creation instead would leave `release/vX.Y.Z` pushed with
      # nothing committed to it, and the `plan` job's guard rails refuse the next dispatch until
      # someone deletes that branch by hand.
      - name: Collect the release notes
        if: needs.plan.outputs.prerelease != 'true'
        run: scripts/collect-release-notes.sh "$VERSION"

      - name: Create the release branch
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/heads/$BRANCH" -f sha="$BASE_SHA" >/dev/null
          echo "created $BRANCH at $BASE_SHA"

      # createCommitOnBranch is used rather than `git commit` or the REST git-data API because
      # GitHub SIGNS commits made by this mutation, and main's ruleset requires signed commits.
      # (The REST API's `signature` field is caller-supplied — it does not sign for you.)
      #
      # The file list comes from the working tree rather than being hardcoded: collecting notes
      # DELETES fragments, which the old three-addition literal could not express at all, and a
      # hand-maintained list silently drops anything new that set-version.sh starts touching. When
      # the collect step above was skipped (pre-release), the working tree only carries the
      # VERSION/Cargo.* changes and gh-file-changes.sh reports exactly those — nothing further to
      # special-case here.
      - name: Commit the bump
        id: commit
        run: |
          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$BRANCH" \
            --arg oid "$BASE_SHA" \
            --arg headline "chore: v$VERSION" \
            --argjson changes "$(scripts/gh-file-changes.sh)" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: { input: {
                branch: { repositoryNameWithOwner: $repo, branchName: $branch },
                expectedHeadOid: $oid,
                message: { headline: $headline },
                fileChanges: $changes
              }}
            }' > "$RUNNER_TEMP/commit.json"
          sha="$(gh api graphql --input "$RUNNER_TEMP/commit.json" --jq .data.createCommitOnBranch.commit.oid)"
          echo "head_sha=$sha" >> "$GITHUB_OUTPUT"

      # Cheaper to fail here than at the merge, where the message is far less obvious.
      - name: Verify GitHub signed the commit
        env: { HEAD_SHA: '${{ steps.commit.outputs.head_sha }}' }
        run: |
          v="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA" --jq .commit.verification.verified)"
          [ "$v" = true ] || { echo "::error::bump commit is unsigned — main's ruleset will reject the merge"; exit 1; }

      - name: Open the release PR
        id: pr
        env:
          BUMP: ${{ needs.plan.outputs.bump }}
          PREV_TAG: ${{ needs.plan.outputs.prev_tag }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          body="Automated release bump to \`$TAG\` (\`$BUMP\` from \`${PREV_TAG:-the start of history}\`).

          Opened by \`.github/workflows/release.yml\`. Merging this is what triggers tag + build + publish;
          the workflow merges it automatically once the required checks pass."
          n="$(gh api -X POST "repos/$GITHUB_REPOSITORY/pulls" \
                 -f title="chore: v$VERSION" -f head="$BRANCH" -f base=main -f body="$body" --jq .number)"
          # `gh pr edit` labels via GraphQL addLabelsToLabelable on a PullRequest node, which is
          # unambiguously covered by `pull-requests: write`. The REST /issues/{n}/labels endpoint
          # documents itself as needing `issues: write`, which this job does not have.
          # The label is load-bearing, not decorative: the `plan` guard rail finds an already-open
          # release PR by it, and .github/release.yml excludes it from the notes by it.
          gh pr edit "$n" --add-label release
          echo "number=$n" >> "$GITHUB_OUTPUT"

      # Documented behaviour is that GITHUB_TOKEN-pushed refs do not start workflow runs, which would
      # leave the PR's required checks unreported for ever; workflow_dispatch is the exception.
      # In practice a `pull_request` run ALSO fires here (observed on the v0.5.0 bump PR: 4 check
      # runs, 2 names across 2 suites). Keep the dispatch anyway — a release must not depend on
      # undocumented behaviour — and let the wait below cope with the duplicate names.
      - name: Start CI on the release branch
        run: gh workflow run ci.yml --ref "$BRANCH"

      # ONE source of truth: the check runs attached to the head SHA.
      #
      # This replaces a pair of steps that read two DIFFERENT sources — this endpoint for "have they
      # appeared", then `gh pr checks` (the PR's GraphQL statusCheckRollup) for "have they passed".
      # The rollup lags by seconds, so the first said "both checks reported" and the second said "no
      # checks reported" one second later and exited 1 — it does not wait when the rollup is empty.
      # See run 31163104469, 08:47:14 -> 08:47:15.
      - name: Wait for the required checks
        env:
          HEAD_SHA: ${{ steps.commit.outputs.head_sha }}
          # A check that never appears used to mean CI did not start at all. That is no longer the
          # whole story: the required context `build + test (macOS, unsigned)` is now carried by
          # `required-build-gate` in ci.yml, which `needs: [changes, build-and-test-macos]` — and
          # GitHub does not create a dependent job (or its check run) until its `needs` all
          # complete. So the context legitimately does not exist until the ~35-45 min macOS build
          # finishes; 10m would fail every release before the build ever gets a chance. Do not
          # "tidy" this back down without re-reading this comment.
          APPEAR_TIMEOUT_MIN: '60'
          # ~35 min for the macOS build plus macos-15 queueing. That is the same build that gates
          # required-build-gate's check run (see APPEAR_TIMEOUT_MIN above), so it must appear before
          # it can pass — but the gate job itself runs in seconds once its needs complete. The job
          # cap is 120 and the merge step can take ~12 more, so this still leaves headroom.
          PASS_TIMEOUT_MIN: '75'
          POLL_SECONDS: '20'
        run: |
          set -euo pipefail
          start=$(date +%s)
          appear_deadline=$(( start + APPEAR_TIMEOUT_MIN * 60 ))
          pass_deadline=$(( start + PASS_TIMEOUT_MIN * 60 ))
          last=''; tick=0

          while :; do
            # The required set comes from main's ruleset, not a literal here, so adding a third
            # required check gates the release automatically. Classification (latest-per-name,
            # which conclusions count) lives in the script so it can be unit-tested.
            report="$(scripts/check-runs-state.sh --sha "$HEAD_SHA")"

            missing=0; pending=0; failed=0; passed=0
            while IFS=$'\t' read -r name state conclusion url; do
              [ -n "$name" ] || continue
              case "$state" in
                missing) missing=$(( missing + 1 )) ;;
                pending) pending=$(( pending + 1 )) ;;
                passed)  passed=$(( passed + 1 )) ;;
                failed)
                  failed=$(( failed + 1 ))
                  echo "::error::required check '$name' concluded '$conclusion' — $url" ;;
              esac
            done <<<"$report"

            if [ "$failed" -gt 0 ]; then
              echo "::error::required checks did not pass on $HEAD_SHA — the release PR is left open"
              exit 1
            fi
            if [ "$missing" -eq 0 ] && [ "$pending" -eq 0 ]; then
              echo "all $passed required checks passed on $HEAD_SHA"
              exit 0
            fi

            state_line="missing=$missing pending=$pending passed=$passed"
            if [ "$state_line" != "$last" ] || [ $(( tick % 15 )) -eq 0 ]; then
              printf '%s  %s\n' "$(date -u +%H:%M:%S)" "$state_line"
              last="$state_line"
            fi
            tick=$(( tick + 1 ))

            now=$(date +%s)
            if [ "$missing" -gt 0 ] && [ "$now" -ge "$appear_deadline" ]; then
              awk -F'\t' '$2 == "missing" { print "::error::never reported: " $1 }' <<<"$report"
              echo "::error::a required check is still missing on $BRANCH after ${APPEAR_TIMEOUT_MIN}m."
              echo "::error::The required context now appears only once required-build-gate's needs"
              echo "::error::(including the macOS build) complete, so this can mean either: the 'Start"
              echo "::error::CI' dispatch failed to kick off a run (it needs actions:write — check"
              echo "::error::ci.yml still accepts workflow_dispatch), or the macOS build has run far"
              echo "::error::longer than its usual ~35-45m. See docs/versioning.md."
              exit 1
            fi
            if [ "$now" -ge "$pass_deadline" ]; then
              echo "::error::required checks still running after ${PASS_TIMEOUT_MIN}m ($state_line) — giving up; the PR is left open"
              exit 1
            fi
            sleep "$POLL_SECONDS"
          done

      - name: Merge the release PR
        id: merge
        env:
          PR: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.commit.outputs.head_sha }}
        run: |
          set -euo pipefail

          # The step above proves the check RUNS are green. The ruleset does not read check runs — it
          # reads the PR's status-check rollup, the same eventually-consistent projection that broke
          # the previous implementation one step earlier. Here staleness surfaces as
          # `mergeable_state: blocked` and a 405. Waiting on check runs gets us here EARLIER than
          # before, so this is the race's new home: converge on the rollup first, then still retry.
          #
          # `mergeable` is null while GitHub computes the merge, and ASKING is what schedules that
          # computation — so poll, never sleep once.
          deadline=$(( $(date +%s) + 10 * 60 ))
          last=''
          while :; do
            read -r mergeable mstate < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" \
              --jq '"\(.mergeable | tostring) \(.mergeable_state)"')
            [ "$mstate" = "$last" ] || { echo "mergeable=$mergeable mergeable_state=$mstate"; last="$mstate"; }
            case "$mstate" in
              # clean = all good; unstable = a NON-required check is red/pending; has_hooks = mergeable.
              clean|unstable|has_hooks) break ;;
              dirty) echo "::error::PR #$PR conflicts with main — resolve it by hand"; exit 1 ;;
              draft) echo "::error::PR #$PR is a draft"; exit 1 ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::PR #$PR is still '$mstate' after 10m even though every required check is green"
              echo "::error::on $HEAD_SHA. Either the rollup has not caught up or a non-status rule is"
              echo "::error::unsatisfied. The PR is left OPEN: merge it by hand and re-dispatch — the"
              echo "::error::workflow will skip the bump and go straight to build + tag + publish."
              exit 1
            fi
            sleep 10
          done

          # -f sha= makes the merge conditional on the branch tip: a 409 beats merging something
          # unexpected if anything raced us.
          for attempt in 1 2 3 4 5 6; do
            if out="$(gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$PR/merge" \
                        -f merge_method=merge -f sha="$HEAD_SHA" \
                        -f commit_title="Merge pull request #$PR from $GITHUB_REPOSITORY_OWNER/$BRANCH" \
                        -f commit_message="chore: v$VERSION" 2>"$RUNNER_TEMP/merge.err")"; then
              sha="$(jq -r '.sha // empty' <<<"$out")"
              [ -n "$sha" ] || { echo "::error::merge reported success but returned no sha: $out"; exit 1; }
              echo "sha=$sha" >> "$GITHUB_OUTPUT"
              echo "merged as $sha"
              exit 0
            fi
            err="$(cat "$RUNNER_TEMP/merge.err")"
            echo "attempt $attempt/6: $err"
            case "$err" in
              *"Head branch was modified"*)
                echo "::error::$BRANCH moved after the bump commit — refusing to merge $HEAD_SHA"; exit 1 ;;
              *[Mm]"erge conflict"*)
                echo "::error::PR #$PR conflicts with main"; exit 1 ;;
              *"HTTP 40"[34]*|*"HTTP 422"*)
                echo "::error::merge rejected and not retryable"; exit 1 ;;
            esac
            # 405 "not mergeable" and 409 "Base branch was modified" are the retryable ones, as is 5xx.
            sleep 20
          done
          echo "::error::could not merge PR #$PR after 6 attempts. It is left OPEN: merge it by hand and"
          echo "::error::re-dispatch — the workflow will skip the bump and go straight to build + publish."
          exit 1

      # Leave the PR and branch alone on failure — they are the recovery material.
      - name: Explain the failure
        if: failure()
        env: { PR: '${{ steps.pr.outputs.number }}' }
        run: |
          {
            echo "## Release bump failed"
            echo
            if [ -n "${PR:-}" ]; then
              echo "PR: $(gh pr view "$PR" --json url --jq .url)"
              gh pr view "$PR" --json mergeStateStatus,statusCheckRollup \
                --jq '"mergeStateStatus: \(.mergeStateStatus)"' || true
              echo
              echo 'The release PR is left OPEN on purpose. Merge it by hand, then re-dispatch:'
              echo 'the workflow will see VERSION already bumped, skip this job, and go straight to'
              echo 'build + tag + publish.'
            else
              echo 'Failed before the PR was opened; nothing to clean up beyond a possible stale'
              echo "\`$BRANCH\` branch."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------ release (build + publish, macOS)
  release:
    name: build + publish (macOS)
    needs: [plan, bump]
    # `bump` is skipped on the recovery path (VERSION already carries the target version), and a
    # skipped dependency must not skip this job.
    if: |
      always() && needs.plan.outputs.proceed == 'true'
      && (needs.bump.result == 'success' || needs.bump.result == 'skipped')
    runs-on: macos-15
    # libghostty cache miss (~10m) + macOS build (~35m) + notarization (occasionally >20m) + DMG +
    # tap push. 90 was uncomfortably close; match `bump`.
    timeout-minutes: 120
    permissions:
      contents: write   # create the tag and the GitHub Release
      actions: write    # to dispatch deploy-site.yml once the tap release is published
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      # The merge commit when `bump` ran; else the exact commit `plan` measured. A skipped job's
      # `outputs` is `{}`, so `merge_sha` is empty and the fallback wins. Both are SHAs on purpose —
      # `main` would re-resolve to whatever the tip is NOW, which is not what was planned.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.bump.outputs.merge_sha || needs.plan.outputs.base_sha }}
          fetch-depth: 0

      # Replaces the old tag-vs-VERSION check: same intent (never ship an artifact labelled with a
      # version we did not plan), now anchored to the plan rather than to a pushed ref.
      - name: Verify the checkout carries the planned version
        run: |
          have="$(tr -d '[:space:]' < VERSION)"
          [ "$have" = "$VERSION" ] || { echo "::error::VERSION is $have, expected $VERSION"; exit 1; }
          cargo_v="$(awk '/^\[workspace\.package\]/{f=1} f&&/^version/{gsub(/[" ]/,"");sub(/^version=/,"");print;exit}' Cargo.toml)"
          [ "$cargo_v" = "$VERSION" ] || { echo "::error::Cargo.toml workspace version is $cargo_v, expected $VERSION"; exit 1; }

      - name: Select Xcode (Metal shader compiler needs full Xcode)
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '16'

      - name: Verify toolchain
        run: |
          xcrun metal --version
          swift --version

      - name: Install zig (Homebrew — reliable bottle CDN; the zig download mirrors are flaky in CI)
        run: |
          brew install zig
          zig version

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable as of 2026-09-01 — no version tag, so Dependabot can't auto-track this one; re-pin periodically to pick up new stable Rust

      - name: Cache libghostty (built once per pin/patch)
        id: libghostty-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            macos/vendor/libghostty/ghostty-internal.a
            macos/Sources/GhosttyKit/include/ghostty.h
          key: libghostty-${{ runner.os }}-${{ hashFiles('scripts/build-libghostty.sh', 'scripts/libghostty-darwin-install.patch') }}

      - name: Build libghostty (cache miss only)
        if: steps.libghostty-cache.outputs.cache-hit != 'true'
        run: scripts/build-libghostty.sh

      - name: Assemble Clowder.app
        run: scripts/build-app.sh

      # Signing material lives in Doppler and is fetched at run time with a read-only, config-scoped
      # Doppler SERVICE TOKEN (the only credential in GitHub — no Apple signing secret is stored here).
      # Gate on the token's presence; secrets aren't reliably usable in `if:`, so surface a boolean
      # output. Forks / a repo without the token publish an unsigned build. See docs/code-signing.md.
      - name: Detect Doppler token
        id: signing
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          if [ -n "$DOPPLER_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No DOPPLER_TOKEN secret — publishing an UNSIGNED build."
          fi

      - name: Fetch signing secrets from Doppler
        id: doppler
        if: steps.signing.outputs.enabled == 'true'
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}

      # ---------- signed path (Doppler token configured) ----------

      # Fail here, not at the tap publish 7 steps later. That step runs AFTER the commit is tagged
      # and the GitHub Release is published, so a token problem there strands a signed, notarized,
      # tagged, published release whose cask never gets bumped (the DMG itself is fine — it lives on
      # this repo's own Release, not the tap — but `brew upgrade` won't see the new version without
      # manual cleanup). Here, nothing has been signed or published: the run just stops.
      #
      # This is not hypothetical. v0.7.0 failed exactly that way with `403 Resource not accessible by
      # personal access token`. Root cause: a fine-grained PAT is granted against a specific resource
      # owner and repository, and that grant does NOT follow a repo across an org transfer. The tap
      # moved to the defiantsoftware org on 2026-08-12, ten minutes after the last publish that used
      # the old grant — so the token kept working until the next release needed it, four days later.
      # It moved again, back to the richardcase account, on 2026-08-30 when clowder went open source
      # under Apache-2.0 — the PAT was reissued under the new resource owner at that time too. On
      # 2026-08-30 the cask also moved off its clowder-specific tap (richardcase/homebrew-clowder)
      # onto a shared tap (richardcase/homebrew-tap), which needed its own reissued PAT grant.
      #
      # `.permissions.push` reflects what THIS token can actually do on the repo, so it catches a
      # revoked, re-scoped or org-transferred grant without writing anything.
      - name: Verify the Homebrew tap token can still write
        if: ${{ steps.signing.outputs.enabled == 'true' && needs.plan.outputs.prerelease != 'true' }}
        env:
          GH_TOKEN: ${{ steps.doppler.outputs.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: richardcase/homebrew-tap
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::No HOMEBREW_TAP_TOKEN in Doppler — the tap publish will be skipped."
            exit 0
          fi
          if ! push="$(gh api "repos/$TAP_REPO" --jq .permissions.push 2>&1)"; then
            echo "::error::cannot read $TAP_REPO with HOMEBREW_TAP_TOKEN: $push"
            echo "::error::Reissue the fine-grained PAT (resource owner richardcase, only"
            echo "::error::$TAP_REPO, Contents: Read and write) and update it in Doppler."
            exit 1
          fi
          [ "$push" = true ] || {
            echo "::error::HOMEBREW_TAP_TOKEN cannot write to $TAP_REPO (permissions.push=$push)."
            echo "::error::A fine-grained PAT's grant does not survive an org transfer or a scope"
            echo "::error::change — reissue it with Contents: Read and write and update Doppler."
            exit 1
          }
          echo "tap token OK — can write to $TAP_REPO"

      - name: Import Developer ID certificate into a temp keychain
        if: steps.signing.outputs.enabled == 'true'
        env:
          CODESIGN_P12_BASE64: ${{ steps.doppler.outputs.CODESIGN_P12_BASE64 }}
          CODESIGN_P12_PASSWORD: ${{ steps.doppler.outputs.CODESIGN_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ steps.doppler.outputs.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/clowder-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CODESIGN_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CODESIGN_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "CODESIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Sign, notarize, and package a DMG
        if: steps.signing.outputs.enabled == 'true'
        env:
          CODESIGN_IDENTITY: ${{ steps.doppler.outputs.CODESIGN_IDENTITY }}
          # API-key notarization (default). Leave these empty in Doppler and set the Apple-ID trio
          # instead to use that path — package-dmg.sh auto-selects whichever set is fully present.
          NOTARY_KEY_BASE64: ${{ steps.doppler.outputs.NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ steps.doppler.outputs.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ steps.doppler.outputs.NOTARY_ISSUER }}
          NOTARY_APPLE_ID: ${{ steps.doppler.outputs.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ steps.doppler.outputs.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ steps.doppler.outputs.NOTARY_TEAM_ID }}
        run: |
          scripts/sign-app.sh
          if [ -n "$NOTARY_KEY_BASE64" ]; then
            echo "$NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            export NOTARY_KEY="$RUNNER_TEMP/notary.p8"
          fi
          scripts/package-dmg.sh
          rm -f "$RUNNER_TEMP/notary.p8"

      # ---------- unsigned fallback (no DOPPLER_TOKEN: forks / unconfigured repo) ----------
      - name: Zip the unsigned app bundle
        if: steps.signing.outputs.enabled != 'true'
        run: ditto -c -k --keepParent dist/Clowder.app "dist/Clowder-$VERSION-macos.zip"

      # ---------- tag LAST, once there is something to publish ----------
      # Deliberately after the build: a tag is the input to the NEXT version computation, so one left
      # behind by a failed build would make the next run measure from it and silently skip a version
      # that never shipped. A bumped VERSION with no tag is benign — a re-dispatch recomputes the
      # same version, sees needs_bump=false, skips `bump`, and lands here again.
      - name: Tag the released commit
        id: tag
        env:
          # The job has no other `gh` usage (update-homebrew-tap.sh exports its own token), so
          # without this the readback below fails with "gh auth login required".
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name  "clowder-release-bot"
          git config user.email "clowder-release-bot@users.noreply.github.com"
          # -a is mandatory: unlike a dev machine, CI has no tag.gpgsign, so a bare `git tag` would
          # quietly create a LIGHTWEIGHT tag. Not signed — no ruleset targets tags, and shipping the
          # signing key to Actions would be a worse trade.
          git tag -a "$TAG" -m "$TAG" HEAD
          git push origin "refs/tags/$TAG"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          # Do NOT hand an unresolvable tag_name to action-gh-release: POST /releases CREATES the tag
          # at target_commitish (the DEFAULT BRANCH) when it does not exist, silently tagging a
          # different commit than the one just built — and reporting success. Wait for the readback.
          for _ in $(seq 1 30); do
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
              echo "$TAG is readable via the API"
              exit 0
            fi
            sleep 2
          done
          echo "::error::$TAG was pushed but is not readable via the API after 60s"
          exit 1

      - name: Publish GitHub Release (signed)
        if: steps.signing.outputs.enabled == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # tag_name is required now that no tag triggered this run — without it the action would
          # create a release named after the branch.
          tag_name: ${{ needs.plan.outputs.tag }}
          # Pin the commit as insurance; ignored because the tag already exists (the step above
          # blocks until it does), but it removes the wrong-commit failure mode entirely.
          target_commitish: ${{ steps.tag.outputs.sha }}
          files: dist/Clowder-*-macos.dmg
          # Default is false: an unmatched glob would publish an EMPTY release and exit green.
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ needs.plan.outputs.prerelease == 'true' }}
          body: |
            Signed & notarized macOS build of Clowder (`${{ needs.plan.outputs.tag }}`).

            Open the `.dmg` and drag **Clowder** to **Applications**. No Gatekeeper workaround needed.

      - name: Publish GitHub Release (unsigned)
        if: steps.signing.outputs.enabled != 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ steps.tag.outputs.sha }}
          files: dist/Clowder-*-macos.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ needs.plan.outputs.prerelease == 'true' }}
          body: |
            Unsigned macOS build of Clowder (`${{ needs.plan.outputs.tag }}`).

            > This build is **not code-signed or notarized** (Doppler signing not configured). On first
            > launch macOS Gatekeeper will quarantine it — right-click the app → **Open**, or run
            > `xattr -dr com.apple.quarantine Clowder.app`.

      # The site reads clowder's own GitHub Release directly (site/src/data/release.ts), which the
      # steps above already published — so this no longer needs to wait on (or depend on the success
      # of) the Homebrew tap's cask bump below. Deliberately placed here, right after publishing,
      # rather than after the tap step.
      #
      # `workflow_dispatch` is the documented exception to "refs pushed with GITHUB_TOKEN do not
      # start workflow runs" — the same reason ci.yml accepts it.
      #
      # Deliberately not a failure: the release itself has already succeeded and been published by
      # this point, and the daily schedule is the backstop. Failing here would report a broken
      # release that is not broken.
      - name: Refresh the site (it reads the source repo's release)
        if: ${{ steps.signing.outputs.enabled == 'true' && needs.plan.outputs.prerelease != 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-site.yml --ref main

      - name: Update Homebrew tap (cask bump)
        if: ${{ steps.signing.outputs.enabled == 'true' && needs.plan.outputs.prerelease != 'true' }}
        env:
          HOMEBREW_TAP_TOKEN: ${{ steps.doppler.outputs.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::warning::No HOMEBREW_TAP_TOKEN in Doppler — skipping Homebrew publish."
            exit 0
          fi
          scripts/update-homebrew-tap.sh

      - name: Remove temp signing keychain
        if: ${{ always() && steps.signing.outputs.enabled == 'true' }}
        run: security delete-keychain "$RUNNER_TEMP/clowder-signing.keychain-db" || true
