[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.8.1"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
bytes = "1"
anyhow = "1"
